<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://www.jiotv.com/">
<link rel="dns-prefetch" href="https://www.jiotv.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/controls.min.css">
<style>
:root{
  --bg:#0b0b0d; --surface:#15151a; --surface-hi:#1c1c24;
  --border:#242430; --border-hi:#34344a;
  --f1-red:#e10600; --f1-red-lt:#ff3b30; --f1-red-glow:rgba(225,6,0,.55);
  --teal:#00d2be; --yellow:#ffd700; --drs-green:#00e676;
  --text:#f5f5f7; --muted:#8a8a99; --dim:#55556a;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-snap:cubic-bezier(.4,0,.2,1);
  --ease-launch:cubic-bezier(.85,0,.15,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:var(--bg);overflow:hidden;
  font-family:'Titillium Web','Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  color:var(--text);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    radial-gradient(ellipse at top, #13131a 0%, var(--bg) 60%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 15% 0%, rgba(225,6,0,.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(0,210,190,.05), transparent 45%);
}

#topBar{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:linear-gradient(90deg,var(--f1-red),#ff4a3f,#e10600);
  box-shadow:0 0 16px var(--f1-red-glow);
  z-index:10002;transition:width .3s var(--ease-out),opacity .3s;
}
#topBar.done{width:100%!important}
#topBar.hide{opacity:0}

#checkerStrip{
  position:fixed;top:0;left:0;right:0;height:5px;z-index:10000;
  background-image:
    linear-gradient(45deg, #fff 25%, transparent 25%),
    linear-gradient(-45deg, #fff 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #fff 75%),
    linear-gradient(-45deg, transparent 75%, #fff 75%);
  background-size:10px 10px;
  background-position:0 0,0 5px,5px -5px,-5px 0;
  background-color:#000;opacity:.9;
}

/* OVERLAY / FORMATION LAP */
#overlay{
  position:fixed;inset:0;background:
    radial-gradient(ellipse at center, #131318 0%, var(--bg) 70%);
  z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:32px;
  transition:opacity .55s var(--ease-out);
  overflow:hidden;
}
#overlay.fade{opacity:0;pointer-events:none}
#overlay.fade .startLights,
#overlay.fade .opening-brand{transform:scale(1.12);opacity:0}

.opening-brand{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .5s var(--ease-out),opacity .5s var(--ease-out);
}
.opening-title{
  display:flex;
  font-family:'Titillium Web',sans-serif;
  font-weight:900;font-style:italic;
  font-size:clamp(28px,7vw,54px);
  letter-spacing:.14em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 40px rgba(225,6,0,.25);
}
.opening-title .lt{
  display:inline-block;
  opacity:0;transform:translateY(14px) rotateX(-40deg);
  animation:ltIn .55s var(--ease-launch) forwards;
  background:linear-gradient(180deg,#fff 0%,#c8c8d0 60%,#8a8a99 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.opening-title .lt.sp{width:.35em}
.opening-title .lt.acc{
  background:linear-gradient(180deg,#ff5a4a 0%,var(--f1-red) 60%,#8a0300 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px var(--f1-red-glow);
}
@keyframes ltIn{to{opacity:1;transform:translateY(0) rotateX(0)}}

.opening-sub{
  color:var(--teal);font-size:11px;font-weight:700;
  letter-spacing:.4em;text-transform:uppercase;
  font-family:'Orbitron',monospace;
  opacity:0;animation:subFade .7s var(--ease-out) .9s forwards;
  display:flex;align-items:center;gap:14px;
  min-height:16px;
}
.opening-sub::before,.opening-sub::after{
  content:"";width:36px;height:1px;background:var(--teal);opacity:.5;
}
@keyframes subFade{to{opacity:1}}

.startLights{
  display:flex;gap:16px;padding:22px 28px;
  background:linear-gradient(180deg,#0a0a0d,#050507);
  border:1px solid #1e1e26;border-radius:16px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 -2px 10px rgba(0,0,0,.6),
    0 25px 70px rgba(0,0,0,.7);
  transition:transform .5s var(--ease-out),opacity .5s var(--ease-out);
  opacity:0;animation:lightsIn .5s var(--ease-out) 1.3s forwards;
}
@keyframes lightsIn{to{opacity:1}}
.light{
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #2a0000, #150000 70%);
  border:2px solid #1a0000;
  box-shadow:
    inset 0 2px 10px rgba(0,0,0,.9),
    inset 0 -1px 4px rgba(255,255,255,.03);
  transition:all .25s var(--ease-snap);
  position:relative;
}
.light.on{
  background:radial-gradient(circle at 30% 30%, #ff5a4a, #e10600 60%, #8a0300 100%);
  border-color:#ff3b30;
  box-shadow:
    0 0 25px var(--f1-red-glow),
    0 0 50px rgba(225,6,0,.35),
    inset 0 0 14px rgba(255,255,255,.4);
}
.light.on::after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), transparent 60%);
}
@media(max-width:480px){
  .light{width:32px;height:32px}
  .startLights{gap:12px;padding:18px 22px;border-radius:12px}
}

.launch-streak{
  position:fixed;top:50%;left:-120%;width:120%;height:4px;
  transform:translateY(-50%);
  background:linear-gradient(90deg,transparent 0%,
    rgba(225,6,0,.5) 20%,var(--f1-red-lt) 50%,rgba(225,6,0,.5) 80%,transparent 100%);
  box-shadow:0 0 50px var(--f1-red-glow),0 0 100px rgba(225,6,0,.5);
  z-index:10001;pointer-events:none;opacity:0;
}
.launch-streak.fire{animation:streakFire .75s var(--ease-launch) forwards}
@keyframes streakFire{
  0%{left:-120%;opacity:1}
  85%{left:100%;opacity:1}
  100%{left:120%;opacity:0}
}

/* TOAST */
#status{
  position:fixed;
  top:max(24px,env(safe-area-inset-top));right:16px;
  transform:translateX(120%);
  z-index:9997;
  display:flex;align-items:center;gap:10px;
  padding:12px 18px 12px 14px;
  background:linear-gradient(135deg,rgba(21,21,26,.97),rgba(11,11,13,.97));
  border:1px solid var(--border-hi);
  border-left-width:5px;
  font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;
  border-radius:8px;pointer-events:none;opacity:0;
  transition:opacity .3s var(--ease-out),transform .35s var(--ease-out);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  white-space:nowrap;max-width:calc(100vw - 32px);
  box-shadow:0 12px 36px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
  font-family:'Orbitron',monospace;
}
#status.show{opacity:1;transform:translateX(0)}
.st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok{border-left-color:#4a90d9;color:#c8d8e8}
#status.ok .st-dot{background:#4a90d9;box-shadow:0 0 10px #4a90d9}
#status.live{border-left-color:var(--drs-green);color:#c8ffe0}
#status.live .st-dot{background:var(--drs-green);box-shadow:0 0 12px var(--drs-green);animation:dotPulse 1.4s ease-in-out infinite}
#status.warn{border-left-color:var(--yellow);color:#ffe89a}
#status.warn .st-dot{background:var(--yellow);box-shadow:0 0 12px var(--yellow);animation:dotPulse .9s ease-in-out infinite}
#status.err{border-left-color:var(--f1-red);color:#ffb3ae}
#status.err .st-dot{background:var(--f1-red);box-shadow:0 0 12px var(--f1-red)}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.3;transform:scale(.6)}
}
.tire-spin{width:12px;height:12px;flex-shrink:0;animation:spin 1.1s linear infinite;color:var(--yellow)}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHANNEL LIST */
#channel-list{
  position:fixed;inset:0;background:transparent;z-index:9998;
  display:none;flex-direction:column;overflow-y:auto;
  padding:calc(max(24px,env(safe-area-inset-top)) + 16px) 18px
           max(30px,env(safe-area-inset-bottom)) 18px;
  scrollbar-width:thin;scrollbar-color:var(--f1-red) transparent;
  opacity:0;transition:opacity .45s var(--ease-out);
}
#channel-list.ready{opacity:1}
#channel-list::-webkit-scrollbar{width:5px}
#channel-list::-webkit-scrollbar-thumb{background:var(--f1-red);border-radius:5px}

#ch-header{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;margin-bottom:30px;padding-bottom:24px;position:relative;
}
#ch-header::after{
  content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:100px;height:3px;
  background:linear-gradient(90deg,transparent,var(--f1-red),transparent);
  box-shadow:0 0 16px var(--f1-red-glow);border-radius:2px;
}
.brand-mark{display:flex;align-items:center;gap:14px}
.brand-mark svg{width:38px;height:24px;filter:drop-shadow(0 0 10px var(--f1-red-glow))}
#ch-header h1{
  color:var(--text);font-size:24px;font-weight:900;
  letter-spacing:5px;text-transform:uppercase;font-style:italic;
  background:linear-gradient(180deg,#fff,#b0b0c0);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
#ch-header .subtitle{
  color:var(--teal);font-size:10px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;
  font-family:'Orbitron',monospace;
  display:flex;align-items:center;gap:10px;
}
#ch-header .subtitle::before,#ch-header .subtitle::after{
  content:"";width:30px;height:1px;background:var(--teal);opacity:.5;
}

#ch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}

.ch-card{
  background:linear-gradient(145deg,var(--surface),var(--surface-hi));
  border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 14px 18px;
  cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:12px;
  transition:transform .25s var(--ease-out),background .25s var(--ease-out),
             border-color .25s var(--ease-out),box-shadow .3s var(--ease-out),
             opacity .3s var(--ease-out);
  -webkit-tap-highlight-color:transparent;
  min-height:150px;position:relative;overflow:hidden;color:inherit;
  opacity:0;transform:translateY(12px);
  animation:cardIn .5s var(--ease-out) forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}

.ch-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--f1-red),#8a0300);
  box-shadow:0 0 16px var(--f1-red-glow);
  transition:width .25s var(--ease-snap);
}
.ch-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px);
  border-radius:11px;
}

.ch-num{
  position:absolute;top:8px;left:12px;
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:900;letter-spacing:1.5px;
  color:var(--f1-red);opacity:.8;z-index:2;
}
.ch-chev{
  position:absolute;top:8px;right:10px;
  color:var(--f1-red);font-size:18px;font-weight:900;
  opacity:0;transform:translateX(-8px);
  transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);
  z-index:2;font-family:'Orbitron',monospace;
}
.ch-card:hover{
  background:linear-gradient(145deg,var(--surface-hi),#22222c);
  border-color:var(--border-hi);
  transform:translateX(5px) translateY(-3px);
  box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px rgba(225,6,0,.2),inset 0 1px 0 rgba(255,255,255,.06);
}
.ch-card:hover::before{width:8px}
.ch-card:hover .ch-chev{opacity:1;transform:translateX(0)}
.ch-card:active{
  transform:translateX(2px) scale(.97);
  background:linear-gradient(145deg,#1a1a22,#22222c);
  box-shadow:0 0 30px var(--f1-red-glow),inset 0 0 25px rgba(225,6,0,.2);
}
.ch-card:focus-visible{outline:2px solid var(--f1-red);outline-offset:3px}

.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(225,6,0,.6) 0%,rgba(225,6,0,0) 70%);
  transform:scale(0);animation:rippleOut .6s var(--ease-out) forwards;z-index:5;
}
@keyframes rippleOut{to{transform:scale(3);opacity:0}}

.ch-card span.ch-name{
  color:var(--text);font-size:12px;font-weight:700;
  letter-spacing:1px;line-height:1.35;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-height:34px;width:100%;
  position:relative;z-index:2;
}
.ch-logo{
  width:100%;max-width:110px;height:60px;object-fit:contain;
  border-radius:8px;flex-shrink:0;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.8));
  transition:transform .3s var(--ease-out);position:relative;z-index:2;
}
.ch-card:hover .ch-logo{transform:scale(1.08)}
.ch-logo-fallback{
  width:110px;height:60px;border-radius:8px;
  background:linear-gradient(135deg,#1a1a2e,#0e0e1a);
  border:1px solid #2a2a4a;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:var(--f1-red);
  letter-spacing:3px;flex-shrink:0;
  font-family:'Orbitron',monospace;position:relative;z-index:2;
}
@media(max-width:480px){
  #ch-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .ch-card{padding:14px 10px 12px 16px;min-height:130px;border-radius:10px}
  .ch-logo,.ch-logo-fallback{max-width:90px;height:50px}
  .ch-logo-fallback{font-size:18px}
  .ch-card span.ch-name{font-size:10.5px;max-height:30px}
  #ch-header h1{font-size:20px;letter-spacing:4px}
}

/* PIT STOP TRANSITION */
#pitStop{
  position:fixed;inset:0;background:#000;z-index:10003;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;opacity:0;transition:opacity .35s var(--ease-out);
}
#pitStop.show{display:flex;opacity:1}
.tire-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;perspective:400px}
.tire-svg{
  width:56px;height:56px;
  animation:tireScrew .35s linear infinite;
  filter:drop-shadow(0 0 12px rgba(225,6,0,.4));
}
@keyframes tireScrew{to{transform:rotate(360deg)}}
#pitStop .pit-label{
  color:var(--f1-red);font-family:'Orbitron',monospace;
  font-size:12px;font-weight:900;letter-spacing:4px;
  text-transform:uppercase;
  animation:pitBlink .55s ease-in-out infinite alternate;
}
@keyframes pitBlink{from{opacity:.55}to{opacity:1}}

/* PLAYER */
#pc{
  position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:manipulation;
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}

#livePill{
  position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;
  display:none;align-items:center;gap:8px;
  padding:8px 14px 8px 11px;
  background:linear-gradient(135deg,rgba(225,6,0,.95),rgba(160,4,0,.95));
  border:1px solid rgba(255,255,255,.2);border-radius:6px;
  font-family:'Orbitron',monospace;
  font-size:11px;font-weight:900;letter-spacing:2.5px;
  color:#fff;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(225,6,0,.6),inset 0 1px 0 rgba(255,255,255,.25);
  z-index:9996;pointer-events:none;backdrop-filter:blur(10px);
}
#livePill.show{display:flex}
#livePill .live-dot{
  width:8px;height:8px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px #fff;animation:dotPulse 1.2s ease-in-out infinite;
}

#volIndicator{
  position:fixed;top:20%;left:50%;transform:translateX(-50%) translateY(-20px);
  padding:14px 22px;background:rgba(0,0,0,.8);
  border:1px solid var(--border-hi);border-radius:12px;
  backdrop-filter:blur(16px);
  font-family:'Orbitron',monospace;font-size:13px;font-weight:900;
  color:#fff;letter-spacing:1.5px;
  display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);
  z-index:9998;
}
#volIndicator.show{opacity:1;transform:translateX(-50%) translateY(0)}
.vol-bar{width:80px;height:6px;background:#22222c;border-radius:3px;overflow:hidden}
.vol-fill{
  height:100%;width:50%;
  background:linear-gradient(90deg,var(--teal),var(--yellow),var(--f1-red));
  transition:width .15s var(--ease-snap);border-radius:3px;
}

/* SHAKA CONTROLS */
.shaka-video-container{background-color:#000!important}
.shaka-scrim-container{
  background:linear-gradient(180deg,
    rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,
    rgba(0,0,0,0) 60%,rgba(0,0,0,.82) 100%) !important;
}
.shaka-bottom-controls{
  padding:0 0 max(6px,env(safe-area-inset-bottom)) 0!important;
  background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.5) 100%);
}
.shaka-seek-bar-container{height:6px!important;border-radius:3px!important;overflow:hidden}
.shaka-range-container{height:6px!important;padding:0!important}
.shaka-seek-bar{
  background:linear-gradient(180deg,#2a2a35,#1a1a22)!important;
  border-radius:3px!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.shaka-playhead{
  background:linear-gradient(180deg,#ff5a4a,var(--f1-red))!important;
  box-shadow:0 0 16px var(--f1-red-glow),0 0 28px rgba(225,6,0,.35),
             inset 0 0 6px rgba(255,255,255,.5)!important;
  width:6px!important;border-radius:3px!important;
  transition:transform .15s var(--ease-snap)!important;
}
.shaka-seek-bar-container:hover .shaka-playhead{transform:scale(1.25)}
.shaka-buffered-bar{
  background:linear-gradient(90deg,rgba(255,215,0,.35),rgba(255,215,0,.65))!important;
}
.shaka-range-element:focus{outline:none!important}

.shaka-controls-button-panel{
  padding:0 10px!important;gap:6px!important;
  font-family:'Titillium Web',sans-serif!important;
  align-items:center!important;
}
.shaka-controls-button-panel button{
  transition:transform .18s var(--ease-snap),background .2s var(--ease-out),
             box-shadow .2s var(--ease-out)!important;
  border-radius:50%!important;
  width:40px!important;height:40px!important;min-width:40px!important;
  padding:0!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  background:rgba(255,255,255,.04)!important;
  border:1px solid rgba(255,255,255,.08)!important;
  position:relative;color:#fff!important;
}
.shaka-controls-button-panel button::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 50%);
  pointer-events:none;
}
.shaka-controls-button-panel button:hover{
  background:linear-gradient(135deg,rgba(225,6,0,.85),rgba(160,4,0,.85))!important;
  border-color:var(--f1-red-lt)!important;
  box-shadow:0 0 20px var(--f1-red-glow),inset 0 1px 0 rgba(255,255,255,.3)!important;

  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";

}

  setTimeout(function next(){

}
function isNonEmpty(v){ return typeof v === "string" && v.trim().length > 0; }
function normalizeKidKey(kid, key){
  if(!isNonEmpty(kid) || !isNonEmpty(key)) return null;
  return { kid: kid.trim().toLowerCase(), key: key.trim().toLowerCase() };
}
function buildClearKeys(ch){
  var out = {};
  if(Array.isArray(ch.sportlink) && ch.sportlink.length > 0){
    ch.sportlink.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }
  if(Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0){
    ch.sonuxs.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }
  var single = normalizeKidKey(ch.key_id, ch.key);
  if(single) out[single.kid] = single.key;
  return out;
}

/* ═══════════ LOAD DATA (with timeout) ═══════════ */
async function loadDataSafe(){
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 8000);
  try{
    var r = await fetch(API, {
      cache: "no-store",
      headers: { Accept: "application/json" },
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!r.ok) throw new Error("HTTP " + r.status);
    var d = await r.json();
    if(Array.isArray(d) && d.length > 0) return { channels: d };
    if(d && Array.isArray(d.channels) && d.channels.length > 0) return d;
    throw new Error("empty response");
  } catch(e){
    clearTimeout(timeoutId);
    console.warn("loadDataSafe failed:", e);
    throw e;
  }
}

/* ═══════════ PIT STOP ═══════════ */
function playPitStop(url){
  if($pitStop) $pitStop.classList.add("show");
  setTimeout(function(){ location.href = url; }, 650);

/* ═══════════ RENDER LIST ═══════════ */
function renderList(channels){
  hideOverlay();
  if(!$grid || !$list) return;
  $grid.innerHTML = "";
  var f = document.createDocumentFragment();

  channels.forEach(function(ch, idx){
    var a = document.createElement("a");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);
    a.style.animationDelay = Math.min(idx * 0.028, 0.9) + "s";

    var num = document.createElement("span");
    num.className = "ch-num";
    num.textContent = "#" + String(idx + 1).padStart(2, "0");
    a.appendChild(num);

    var chev = document.createElement("span");
    chev.className = "ch-chev";
    chev.textContent = "›";
    a.appendChild(chev);

    var logoUrl = ch.logo || LOGO_MAP[ch.id] || "";
    var initials = (ch.name || "TV").split(" ").slice(0,2).map(function(w){return w[0]||'';}).join('');

    if(isNonEmpty(logoUrl)){
      var img = document.createElement("img");
      img.className = "ch-logo";
      img.src = logoUrl;
      img.alt = ch.name;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onerror = function(){
        this.style.display = "none";
        var fb = document.createElement("div");
        fb.className = "ch-logo-fallback";
        fb.textContent = initials;
        if(this.parentNode) this.parentNode.insertBefore(fb, this);
      };
      a.appendChild(img);
    } else {
      var fb = document.createElement("div");
      fb.className = "ch-logo-fallback";
      fb.textContent = initials;
      a.appendChild(fb);
    }

    var span = document.createElement("span");
    span.className = "ch-name";
    span.textContent = ch.name;
    a.appendChild(span);

    a.addEventListener("click", function(e){
      e.preventDefault();
      var rect = a.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var rip = document.createElement("span");
      rip.className = "ripple";
      rip.style.width = rip.style.height = size + "px";
      var cx = (e.clientX || (rect.left + rect.width/2)) - rect.left;
      var cy = (e.clientY || (rect.top + rect.height/2)) - rect.top;
      rip.style.left = (cx - size/2) + "px";
      rip.style.top  = (cy - size/2) + "px";
      a.appendChild(rip);
      setTimeout(function(){ if(rip.parentNode) rip.parentNode.removeChild(rip); }, 620);
      setTimeout(function(){ playPitStop(a.href); }, 260);
    });

    f.appendChild(a);
  });

  $grid.appendChild(f);
  $list.style.display = "flex";
  requestAnimationFrame(function(){ $list.classList.add("ready"); });
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

/* ═══════════ CUSTOM FIT BUTTON ═══════════ */
function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;
  if(panel.querySelector(".sp-fit-btn")) return true;

  var anchor = panel.querySelector(".shaka-fullscreen-button") ||
               panel.querySelector(".shaka-overflow-menu-button");
  var fitIdx = 0;
  var fitBtn = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }
  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }
  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function once(){
    vid.removeEventListener("timeupdate", once);
    updateRatio();
  });
  updateRatio();
  return true;
}

/* ═══════════ VOLUME INDICATOR ═══════════ */
function setupVolumeIndicator(vid){
  if(!$volInd) return;
  function show(){
    var v = Math.round((vid.muted ? 0 : vid.volume) * 100);
    if($volFill) $volFill.style.width = v + "%";
    if($volNum)  $volNum.textContent = v;
    $volInd.classList.add("show");
    if(_volTmr) clearTimeout(_volTmr);
    _volTmr = setTimeout(function(){ $volInd.classList.remove("show"); }, 1200);
  }
  vid.addEventListener("volumechange", show);
}

/* ═══════════ TELEMETRY ═══════════ */
function setupTelemetry(player, vid){
  if(TIER === "low" || !$telem) return;
  $telem.classList.add("show");
  var $bit = document.getElementById("tBitrate");
  var $res = document.getElementById("tRes");
  var $buf = document.getElementById("tBuf");
  var $drp = document.getElementById("tDrop");
  var $arc = document.getElementById("qArc");
  var $qt  = document.getElementById("qTxt");

  function arcFill(pct){
    if($arc) $arc.style.strokeDashoffset = String(50 - 50 * pct);
  }
  function update(){
    try{
      var stats = player.getStats();
      if(!stats) return;
      if(stats.estimatedBandwidth && $bit){
        $bit.textContent = Math.round(stats.estimatedBandwidth / 1000) + "k";
      }
      var w = stats.width || vid.videoWidth;
      var h = stats.height || vid.videoHeight;
      if(w && h && $res){
        $res.textContent = w + "×" + h;
        var q = h >= 1080 ? 1 : h >= 720 ? 0.7 : h >= 480 ? 0.45 : 0.25;
        arcFill(q);
        if($qt) $qt.textContent = h >= 1080 ? "FHD" : h >= 720 ? "HD" : h >= 480 ? "SD" : "LOW";
      }
      var vbuf = 0;
      try{
        var ranges = vid.buffered;
        if(ranges && ranges.length){
          var t = vid.currentTime;
          for(var i=0;i<ranges.length;i++){
            if(t >= ranges.start(i) && t <= ranges.end(i)){
              vbuf = ranges.end(i) - t; break;
            }
          }
        }
      }catch(_){}
      if($buf){
        $buf.textContent = vbuf.toFixed(1) + "s";
        $buf.className = vbuf > 5 ? "val-teal" : vbuf > 2 ? "val-yellow" : "val-red";
      }
      if(stats.droppedFrames != null && $drp){
        $drp.textContent = String(stats.droppedFrames);
        $drp.className = stats.droppedFrames > 30 ? "val-red" : stats.droppedFrames > 5 ? "val-yellow" : "";
      }
    }catch(_){}
  }
  setInterval(update, 2000);
  update();
}

/* ═══════════ PLAYER ═══════════ */
async function startPlayer(ch){
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    toast("Browser Not Supported.","err",0);
    return;
  }

  var player = new shaka.Player();
  await player.attach($vid);

  var isMobile = window.matchMedia("(max-width: 600px)").matches;
  var controlsList = isMobile
    ? ["play_pause","mute","time_and_duration","spacer","quality","fullscreen"]
    : ["play_pause","mute","volume","time_and_duration","spacer","quality","picture_in_picture","fullscreen"];

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements: controlsList,
    seekBarColors:{
      base:    "#2a2a35",
      buffered:"rgba(255,215,0,.55)",
      played:  "#e10600"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 6) setTimeout(tryInject, 150);
  })();

  setupTelemetry(player, $vid);
  setupVolumeIndicator($vid);

  var cookie = ch.cookie;
  var raw    = rawCookie(cookie);
  var url    = ch.stream_url;
  var drmKeys = buildClearKeys(ch);

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(Object.keys(drmKeys).length === 0){
    toast("No DRM Keys Available","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }
  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false, retries = 0, edgeTried = false;
  var lastTry = 0, started = false, stallTmr = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d = await loadDataSafe();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie  = fresh.cookie;
      raw     = rawCookie(cookie);
      drmKeys = freshKeys;
      url     = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast(shakaErrStr(err),"err",6000);
    }
  });

  try{
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }
  function onPlaying(){
    started = true;
    if($livePill) $livePill.classList.add("show");
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error", function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

/* ═══════════ MAIN — ROBUST ═══════════ */
async function main(){
  var id = getChId();
  topBar(15);

  // Run lights in background with safety guard
  var lightsResolved = false;
  var lightsPromise = new Promise(function(resolve){
    runStartLights(function(){
      lightsResolved = true;
      topBar(60);
      resolve();
    });
  });
  var lightsGuard = setTimeout(function(){
    if(!lightsResolved){
      lightsResolved = true;
      _lightsDone = true;
      for(var j=0; j<$lights.length; j++){
        if($lights[j]) $lights[j].classList.remove("on");
      }
      if($streak){
        $streak.classList.add("fire");
        setTimeout(function(){ if($streak) $streak.style.display = "none"; }, 800);
      }
      topBar(60);
    }
  }, 8000);

  // Fetch data
  var data = null;
  try{
    topBar(35);
    data = await loadDataSafe();
    topBar(80);
  }catch(e){
    clearTimeout(lightsGuard);
    // Show error on overlay if we're still on it
    if($sub){
      $sub.innerHTML = 'CONNECTION FAILED · <a href="javascript:location.reload()" style="color:#ff3b30;text-decoration:underline;cursor:pointer">RETRY</a>';
    }
    toast("Connection Error. Please Retry.","err",0);
    return;
  }

  // Wait for lights to finish (or 8s guard)
  await Promise.race([
    lightsPromise,
    new Promise(function(r){ setTimeout(r, 8000); })
  ]);
  clearTimeout(lightsGuard);

  if(!data || !data.channels || data.channels.length === 0){
    if($sub){
      $sub.innerHTML = 'NO CHANNELS AVAILABLE · <a href="javascript:location.reload()" style="color:#ff3b30;text-decoration:underline;cursor:pointer">RETRY</a>';
    }
    toast("No Channels Available.","err",0);
    return;
  }

  // No id → show grid
  if(!id){
    renderList(data.channels);
    topBar(null);
    return;
  }

  // Has id → start player
  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){
    hideOverlay();
    toast("Channel Not Found.","err",0);
    setTimeout(function(){ location.href = location.pathname; }, 1800);
    return;
  }
  document.title = ch.name;
  topBar(95);

  hideOverlay();
  startPlayer(ch);
}

document.addEventListener("DOMContentLoaded", main);
})();
