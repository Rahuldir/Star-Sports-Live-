<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://www.jiotv.com/">
<link rel="dns-prefetch" href="https://www.jiotv.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/controls.min.css">
<style>
/* ═══════════════════════════════════════════════════
   F1 PREMIUM THEME
   Carbon black · F1 red · Mercedes teal · Pirelli yellow
═══════════════════════════════════════════════════ */

:root{
  --bg:          #0b0b0d;
  --surface:     #15151a;
  --surface-hi:  #1c1c24;
  --border:      #242430;
  --border-hi:   #34344a;
  --f1-red:      #e10600;
  --f1-red-glow: rgba(225,6,0,.55);
  --teal:        #00d2be;
  --yellow:      #ffd700;
  --drs-green:   #00e676;
  --text:        #f5f5f7;
  --muted:       #8a8a99;
  --dim:         #55556a;
  --carbon-1:    #0e0e11;
  --carbon-2:    #14141a;
  --ease-out:    cubic-bezier(.22,1,.36,1);
  --ease-snap:   cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:var(--bg);overflow:hidden;
  font-family:'Titillium Web','Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  color:var(--text);
  /* Carbon fiber texture base */
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    radial-gradient(ellipse at top, #13131a 0%, var(--bg) 60%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 15% 0%, rgba(225,6,0,.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(0,210,190,.05), transparent 45%);
}

/* ═══════════ TOP LOADING BAR ═══════════ */
#topBar{
  position:fixed;top:0;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,var(--f1-red),#ff4a3f,#e10600);
  box-shadow:0 0 12px var(--f1-red-glow);
  z-index:10002;transition:width .3s var(--ease-out),opacity .3s;
}
#topBar.done{width:100%!important}
#topBar.hide{opacity:0}

/* ═══════════ CHECKERED HEADER STRIP ═══════════ */
#checkerStrip{
  position:fixed;top:0;left:0;right:0;height:4px;z-index:10000;
  background-image:
    linear-gradient(45deg, #fff 25%, transparent 25%),
    linear-gradient(-45deg, #fff 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #fff 75%),
    linear-gradient(-45deg, transparent 75%, #fff 75%);
  background-size:8px 8px;
  background-position:0 0,0 4px,4px -4px,-4px 0;
  background-color:#000;
  opacity:.85;
}

/* ═══════════ OVERLAY / START LIGHTS ═══════════ */
#overlay{
  position:fixed;inset:0;background:
    radial-gradient(ellipse at center, #131318 0%, var(--bg) 70%);
  z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:32px;
  transition:opacity .5s var(--ease-out);
}
#overlay.fade{opacity:0;pointer-events:none}
#overlay.fade .startLights{transform:scale(1.15)}

.startLights{
  display:flex;gap:14px;padding:20px 26px;
  background:linear-gradient(180deg,#0a0a0d,#050507);
  border:1px solid #1e1e26;border-radius:14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 -2px 8px rgba(0,0,0,.6),
    0 20px 60px rgba(0,0,0,.6);
  transition:transform .4s var(--ease-out);
}
.light{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #2a0000, #150000 70%);
  border:2px solid #1a0000;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.9),
    inset 0 -1px 4px rgba(255,255,255,.03);
  transition:all .25s var(--ease-snap);
  position:relative;
}
.light.on{
  background:radial-gradient(circle at 30% 30%, #ff5a4a, #e10600 60%, #8a0300 100%);
  border-color:#ff3b30;
  box-shadow:
    0 0 20px var(--f1-red-glow),
    0 0 40px rgba(225,6,0,.35),
    inset 0 0 12px rgba(255,255,255,.4);
}
.light.on::after{
  content:"";position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), transparent 60%);
}

#loadMsg{
  color:var(--muted);font-size:12px;letter-spacing:2.5px;
  text-transform:uppercase;font-weight:700;text-align:center;
  font-family:'Orbitron',monospace;
}
#loadSub{
  color:var(--dim);font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;margin-top:-18px;
}
#loadSub b{color:var(--f1-red)}

/* ═══════════ STATUS TOAST — RACE CONTROL ═══════════ */
#status{
  position:fixed;
  top:max(20px,env(safe-area-inset-top));
  right:16px;
  transform:translateX(120%);
  z-index:9997;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 10px 12px;
  background:linear-gradient(135deg,rgba(21,21,26,.97),rgba(11,11,13,.97));
  border:1px solid var(--border-hi);
  border-left-width:4px;
  font-size:11.5px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;
  border-radius:6px;pointer-events:none;opacity:0;
  transition:opacity .3s var(--ease-out),transform .35s var(--ease-out);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  white-space:nowrap;max-width:calc(100vw - 32px);
  box-shadow:0 10px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
  font-family:'Orbitron',monospace;
}
#status.show{opacity:1;transform:translateX(0)}
.st-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  display:inline-block;position:relative;
}
#status.ok   {border-left-color:#4a90d9;color:#c8d8e8}
#status.ok   .st-dot{background:#4a90d9;box-shadow:0 0 8px #4a90d9}
#status.live {border-left-color:var(--drs-green);color:#c8ffe0}
#status.live .st-dot{background:var(--drs-green);box-shadow:0 0 10px var(--drs-green);animation:dotPulse 1.4s ease-in-out infinite}
#status.warn {border-left-color:var(--yellow);color:#ffe89a}
#status.warn .st-dot{background:var(--yellow);box-shadow:0 0 10px var(--yellow);animation:dotPulse .9s ease-in-out infinite}
#status.err  {border-left-color:var(--f1-red);color:#ffb3ae}
#status.err  .st-dot{background:var(--f1-red);box-shadow:0 0 10px var(--f1-red)}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

/* ═══════════ CHANNEL LIST — GRID VIEW ═══════════ */
#channel-list{
  position:fixed;inset:0;background:transparent;z-index:9998;
  display:none;flex-direction:column;overflow-y:auto;
  padding:calc(max(20px,env(safe-area-inset-top)) + 12px) 16px
           max(24px,env(safe-area-inset-bottom)) 16px;
  scrollbar-width:thin;scrollbar-color:var(--f1-red) transparent;
}
#channel-list::-webkit-scrollbar{width:4px}
#channel-list::-webkit-scrollbar-thumb{background:var(--f1-red);border-radius:4px}

#ch-header{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;margin-bottom:26px;padding-bottom:20px;position:relative;
}
#ch-header::after{
  content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:80px;height:2px;
  background:linear-gradient(90deg,transparent,var(--f1-red),transparent);
  box-shadow:0 0 12px var(--f1-red-glow);
}
.brand-mark{
  display:flex;align-items:center;gap:12px;
}
.brand-mark svg{
  width:32px;height:20px;
  filter:drop-shadow(0 0 8px var(--f1-red-glow));
}
#ch-header h1{
  color:var(--text);font-size:22px;font-weight:900;
  letter-spacing:4px;text-transform:uppercase;
  font-style:italic;
  background:linear-gradient(180deg,#fff,#b0b0c0);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
#ch-header .subtitle{
  color:var(--teal);font-size:9.5px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  font-family:'Orbitron',monospace;
  display:flex;align-items:center;gap:8px;
}
#ch-header .subtitle::before,#ch-header .subtitle::after{
  content:"";width:24px;height:1px;background:var(--teal);opacity:.4;
}

#ch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
}

/* ═══════════ CHANNEL CARD — LIVERIED GRID SLOT ═══════════ */
.ch-card{
  background:linear-gradient(145deg,var(--surface),var(--surface-hi));
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 12px 12px 16px;
  cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;
  transition:transform .25s var(--ease-out),
             background .25s var(--ease-out),
             border-color .25s var(--ease-out),
             box-shadow .3s var(--ease-out);
  -webkit-tap-highlight-color:transparent;
  min-height:140px;position:relative;overflow:hidden;
  color:inherit;
}
/* Red livery stripe on the left */
.ch-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--f1-red),#8a0300);
  box-shadow:0 0 12px var(--f1-red-glow);
  transition:width .25s var(--ease-snap);
}
/* Carbon-fiber inner texture */
.ch-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px);
  border-radius:9px;
}

/* Grid number badge */
.ch-num{
  position:absolute;top:6px;left:10px;
  font-family:'Orbitron',monospace;
  font-size:9px;font-weight:900;letter-spacing:1px;
  color:var(--f1-red);opacity:.75;
  z-index:2;
}
/* Chevron arrow (appears on hover) */
.ch-chev{
  position:absolute;top:6px;right:8px;
  color:var(--f1-red);font-size:16px;font-weight:900;
  opacity:0;transform:translateX(-6px);
  transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);
  z-index:2;font-family:'Orbitron',monospace;
}

.ch-card:hover{
  background:linear-gradient(145deg,var(--surface-hi),#22222c);
  border-color:var(--border-hi);
  transform:translateX(4px) translateY(-2px);
  box-shadow:
    0 12px 32px rgba(0,0,0,.55),
    0 0 0 1px rgba(225,6,0,.15),
    inset 0 1px 0 rgba(255,255,255,.05);
}
.ch-card:hover::before{width:6px}
.ch-card:hover .ch-chev{opacity:1;transform:translateX(0)}

.ch-card:active{
  transform:translateX(2px) scale(.97);
  background:linear-gradient(145deg,#1a1a22,#22222c);
  box-shadow:0 0 24px var(--f1-red-glow),inset 0 0 20px rgba(225,6,0,.15);
}
.ch-card:focus-visible{
  outline:2px solid var(--f1-red);outline-offset:3px;
}

.ch-card span.ch-name{
  color:var(--text);font-size:11px;font-weight:700;
  letter-spacing:.8px;line-height:1.35;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-height:32px;width:100%;
  position:relative;z-index:2;
}

.ch-logo{
  width:100%;max-width:100px;height:56px;object-fit:contain;
  border-radius:6px;flex-shrink:0;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
  transition:transform .3s var(--ease-out);
  position:relative;z-index:2;
}
.ch-card:hover .ch-logo{transform:scale(1.06)}

.ch-logo-fallback{
  width:100px;height:56px;border-radius:6px;
  background:linear-gradient(135deg,#1a1a2e,#0e0e1a);
  border:1px solid #2a2a4a;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:var(--f1-red);
  letter-spacing:2px;flex-shrink:0;
  font-family:'Orbitron',monospace;
  position:relative;z-index:2;
}

@media(max-width:480px){
  #ch-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .ch-card{padding:12px 8px 10px 14px;min-height:120px;border-radius:8px}
  .ch-logo,.ch-logo-fallback{max-width:80px;height:44px}
  .ch-logo-fallback{font-size:16px}
  .ch-card span.ch-name{font-size:9.5px;max-height:28px}
  #ch-header h1{font-size:18px;letter-spacing:3px}
}

/* ═══════════ PLAYER ═══════════ */
#pc{
  position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:manipulation;
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}

/* Live pill on video */
#livePill{
  position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;
  display:none;align-items:center;gap:7px;
  padding:6px 12px 6px 9px;
  background:linear-gradient(135deg,rgba(225,6,0,.95),rgba(160,4,0,.95));
  border:1px solid rgba(255,255,255,.15);
  border-radius:5px;
  font-family:'Orbitron',monospace;
  font-size:10.5px;font-weight:900;letter-spacing:2px;
  color:#fff;text-transform:uppercase;
  box-shadow:0 4px 16px rgba(225,6,0,.5),inset 0 1px 0 rgba(255,255,255,.2);
  z-index:9996;pointer-events:none;
  backdrop-filter:blur(8px);
}
#livePill.show{display:flex}
#livePill .live-dot{
  width:7px;height:7px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px #fff;animation:dotPulse 1.2s ease-in-out infinite;
}

/* ═══════════ SHAKA CONTROLS — BROADCAST RESTYLE ═══════════ */
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}

.shaka-scrim-container{
  background:linear-gradient(180deg,
    rgba(0,0,0,.55) 0%,
    rgba(0,0,0,0) 25%,
    rgba(0,0,0,0) 65%,
    rgba(0,0,0,.75) 100%) !important;
}

/* Seek bar — F1 styled */
.shaka-seek-bar-container{height:4px!important;border-radius:2px!important;overflow:hidden}
.shaka-range-container{height:4px!important}
.shaka-seek-bar{
  background:linear-gradient(180deg,#2a2a35,#1a1a22)!important;
  border-radius:2px!important;
}
.shaka-playhead{
  background:var(--f1-red)!important;
  box-shadow:0 0 10px var(--f1-red-glow)!important;
  width:4px!important;
  border-radius:2px!important;
}
.shaka-buffered-bar{
  background:linear-gradient(90deg,rgba(255,215,0,.3),rgba(255,215,0,.55))!important;
}
.shaka-range-element:focus{outline:none!important}

/* Control panel backdrop */
.shaka-controls-button-panel{
  padding:0 6px!important;gap:2px!important;
  font-family:'Titillium Web',sans-serif!important;
}
.shaka-controls-button-panel button{
  transition:transform .15s var(--ease-snap),background .2s!important;
  border-radius:6px!important;
}
.shaka-controls-button-panel button:hover{
  background:rgba(225,6,0,.15)!important;
}
.shaka-controls-button-panel button:active{transform:scale(.9)!important}

.shaka-current-time{
  font-family:'Orbitron',monospace!important;
  font-size:11px!important;font-weight:700!important;
  letter-spacing:1px!important;
  color:#d8d8e0!important;
}

/* Custom Fit button (uses .sp-btn) */
.sp-btn{
  background:transparent!important;border:none!important;
  cursor:pointer!important;padding:0 8px!important;
  opacity:.85;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:44px;
  transition:opacity .15s,color .15s,transform .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent;
}
.sp-btn:hover{opacity:1;background:rgba(225,6,0,.15)!important}
.sp-btn:active{opacity:1;transform:scale(.88)}
.sp-btn:focus-visible{outline:2px solid var(--f1-red);outline-offset:2px;border-radius:6px}
.sp-fit-btn{padding:0 8px!important;min-width:auto!important}

.fit-pill{
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:900;letter-spacing:1.2px;
  padding:4px 8px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.32);
  color:rgba(255,255,255,.9);
  pointer-events:none;white-space:nowrap;
  background:rgba(0,0,0,.4);
  transition:border-color .2s,color .2s,background .2s,box-shadow .2s;
  text-transform:uppercase;
}
.sp-fit-btn:hover .fit-pill{
  border-color:rgba(255,255,255,.7);color:#fff;
  background:rgba(225,6,0,.2);
}
.sp-fit-btn.mode-fill  .fit-pill{
  border-color:var(--teal);color:var(--teal);
  background:rgba(0,210,190,.12);
  box-shadow:0 0 10px rgba(0,210,190,.3);
}
.sp-fit-btn.mode-cover .fit-pill{
  border-color:var(--yellow);color:var(--yellow);
  background:rgba(255,215,0,.12);
  box-shadow:0 0 10px rgba(255,215,0,.3);
}

/* ═══════════ TELEMETRY WIDGET ═══════════ */
#telemetry{
  position:absolute;
  top:max(16px,env(safe-area-inset-top));right:16px;
  display:none;flex-direction:column;gap:6px;
  padding:10px 12px;
  background:linear-gradient(135deg,rgba(11,11,13,.85),rgba(21,21,26,.85));
  border:1px solid var(--border-hi);
  border-radius:8px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-family:'Orbitron',monospace;
  font-size:9px;font-weight:700;letter-spacing:1.2px;
  color:var(--muted);text-transform:uppercase;
  z-index:9996;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
  min-width:130px;
}
#telemetry.show{display:flex}
.telem-row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.telem-row b{color:var(--text);font-weight:900;letter-spacing:.5px}
.telem-row .val-teal{color:var(--teal)}
.telem-row .val-yellow{color:var(--yellow)}
.telem-row .val-red{color:var(--f1-red)}

/* Quality gauge (arc) */
.q-gauge{display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:8px;
  border-top:1px solid var(--border)}
.q-gauge svg{width:34px;height:20px}
.q-gauge .q-txt{color:var(--teal);font-size:10px;font-weight:900}

/* ═══════════ REDUCED MOTION ═══════════ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media(max-width:380px){
  .fit-pill{font-size:9px;padding:3px 6px}
  .sp-btn{padding:0 5px!important}
  #telemetry{font-size:8px;padding:8px 10px;min-width:110px}
}
</style>
</head>
<body>

<div id="topBar"></div>
<div id="checkerStrip"></div>

<div id="overlay">
  <div class="startLights" id="startLights">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
  </div>
  <p id="loadMsg">Starting Grid</p>
  <p id="loadSub">Powered by <b>SPORTLINK</b></p>
</div>

<div id="status"></div>

<div id="channel-list">
  <div id="ch-header">
    <div class="brand-mark">
      <svg viewBox="0 0 60 26" fill="none">
        <!-- F1 car silhouette -->
        <path d="M2 18 L8 16 L14 12 L22 10 L30 10 L36 12 L44 16 L54 17 L58 19 L54 21 L6 21 Z"
              fill="#e10600"/>
        <circle cx="14" cy="21" r="4" fill="#0b0b0d" stroke="#e10600" stroke-width="1.5"/>
        <circle cx="46" cy="21" r="4" fill="#0b0b0d" stroke="#e10600" stroke-width="1.5"/>
        <path d="M30 4 L36 10 L30 10 Z" fill="#e10600"/>
      </svg>
      <h1>Sportlink TV</h1>
    </div>
    <div class="subtitle">Season 2026 · Live Grid</div>
  </div>
  <div id="ch-grid"></div>
</div>

/* ═══════════ DEVICE TIER ═══════════ */
function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}
var TIER = getTier();
var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

/* ═══════════ START-LIGHTS SEQUENCE ═══════════ */
var _lightsDone = false;
function runStartLights(cb){
  if(TIER === "low" || _lightsDone){ _lightsDone = true; cb(); return; }
  var i = 0;
  function next(){
    if(i < $lights.length){
      $lights[i].classList.add("on");
      i++;
      setTimeout(next, 380);
    } else {
      // All 5 lit, hold, then "lights out"
      setTimeout(function(){
        $lights.forEach(function(l){ l.classList.remove("on"); });
        _lightsDone = true;
        cb();
      }, 650);
    }
  }
  setTimeout(next, 120);
}

/* ═══════════ TOP LOADING BAR ═══════════ */
function topBar(pct){

  $topBar.style.width = Math.min(90, pct) + "%";
}

/* ═══════════ TOAST ═══════════ */
function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m){ if($loadMsg) $loadMsg.textContent = m; }
function setSub(s){ if($loadSub) $loadSub.innerHTML = s; }
function hideOverlay(){
  $overlay.classList.add("fade");
  setTimeout(function(){ $overlay.style.display = "none"; }, 520);
}
function getChId(){ return new URLSearchParams(location.search).get("id") || ""; }

/* ═══════════ UTILITIES ═══════════ */
function rawCookie(c){
  return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
}
function withCookie(u, r){
  if(!u || !r) return u;
  if(u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}
function isNonEmpty(v){ return typeof v === "string" && v.trim().length > 0; }
function normalizeKidKey(kid, key){
  if(!isNonEmpty(kid) || !isNonEmpty(key)) return null;
  return { kid: kid.trim().toLowerCase(), key: key.trim().toLowerCase() };
}

function buildClearKeys(ch){
  var out = {};
  if(Array.isArray(ch.sportlink) && ch.sportlink.length > 0){
    ch.sportlink.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }
  if(Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0){
    ch.sonuxs.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }
  var single = normalizeKidKey(ch.key_id, ch.key);
  if(single) out[single.kid] = single.key;
  return out;
}

/* ═══════════ LOAD DATA ═══════════ */
async function loadData(){
  try {
    var r = await fetch(API, {cache:"no-store", headers:{Accept:"application/json"}});
    if(r.ok){
      var d = await r.json();
      if(Array.isArray(d) && d.length > 0) return { channels: d };
      if(d && Array.isArray(d.channels) && d.channels.length > 0) return d;
    }
  } catch(e){ console.warn("API failed:", e); }
  return { channels: [] };
}

function errMsg(msg){

  setSub("Please refresh to try again");
  $overlay.style.display = "flex";

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = { "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1, "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2 };
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

/* ═══════════ CUSTOM FIT BUTTON ═══════════ */
function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx = 0;
  var fitBtn = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();
  return true;
}

/* ═══════════ TELEMETRY ═══════════ */
function setupTelemetry(player, vid){
  if(TIER === "low") return;
  $telem.classList.add("show");

  var $bit = document.getElementById("tBitrate");
  var $res = document.getElementById("tRes");
  var $buf = document.getElementById("tBuf");
  var $drp = document.getElementById("tDrop");
  var $arc = document.getElementById("qArc");
  var $qt  = document.getElementById("qTxt");

  function arcFill(pct){
    // Arc total length ≈ 50 (half circle of r=16)
    var len = 50;
    $arc.style.strokeDashoffset = String(len - (len * pct));
  }

  function update(){
    try{
      var stats = player.getStats();
      if(stats){
        // Bitrate
        if(stats.estimatedBandwidth){
          $bit.textContent = Math.round(stats.estimatedBandwidth / 1000) + "k";
        }
        // Resolution
        var w = stats.width || vid.videoWidth;
        var h = stats.height || vid.videoHeight;
        if(w && h){
          $res.textContent = w + "×" + h;
          var q = h >= 1080 ? 1 : h >= 720 ? 0.7 : h >= 480 ? 0.45 : 0.25;
          arcFill(q);
          $qt.textContent = h >= 1080 ? "FHD" : h >= 720 ? "HD" : h >= 480 ? "SD" : "LOW";
        }
        // Buffer
        var buf = stats.bufferingTime || 0;
        var vbuf = 0;
        try{
          var ranges = vid.buffered;
          if(ranges && ranges.length){
            var t = vid.currentTime;
            for(var i=0;i<ranges.length;i++){
              if(t >= ranges.start(i) && t <= ranges.end(i)){
                vbuf = ranges.end(i) - t;
                break;
              }
            }
          }
        }catch(_){}
        $buf.textContent = vbuf.toFixed(1) + "s";
        $buf.className = vbuf > 5 ? "val-teal" : vbuf > 2 ? "val-yellow" : "val-red";
        // Dropped
        if(stats.droppedFrames != null){
          $drp.textContent = String(stats.droppedFrames);
          $drp.className = stats.droppedFrames > 30 ? "val-red" : stats.droppedFrames > 5 ? "val-yellow" : "";
        }
      }
    }catch(_){}
  }

  setInterval(update, 2000);
  update();
}

/* ═══════════ PLAYER ═══════════ */
async function startPlayer(ch){
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

  var player = new shaka.Player();
  await player.attach($vid);

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements:[
      "play_pause","mute","volume",
      "time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{
      base:    "#2a2a35",
      buffered:"rgba(255,215,0,.55)",
      played:  "#e10600"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  setupTelemetry(player, $vid);

  var cookie = ch.cookie;
  var raw    = rawCookie(cookie);
  var url    = ch.stream_url;
  var drmKeys = buildClearKeys(ch);

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(Object.keys(drmKeys).length === 0){
    toast("No DRM Keys Available","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries    = 0;
  var edgeTried  = false;
  var lastTry    = 0;
  var started    = false;
  var stallTmr   = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d     = await loadData();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie  = fresh.cookie;
      raw     = rawCookie(cookie);
      drmKeys = freshKeys;
      url     = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast(shakaErrStr(err),"err",6000);
    }
  });

  try{
    setMsg("Loading Stream");
    setSub("Warming up <b>POWER UNIT</b>");
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }

  function onPlaying(){
    started = true;
    $livePill.classList.add("show");
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error",   function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

/* ═══════════ MAIN ═══════════ */
async function main(){
  var id = getChId(), data;

  topBar(15);
  runStartLights(function(){});

  try{
    setMsg("Fetching Grid");
    setSub("Locating <b>CHANNELS</b>");
    topBar(45);
    data = await loadData();
    topBar(80);
  }catch(_){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }

  if(!id){
    renderList(data.channels);
    topBar(null);
    return;
  }

  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){ errMsg("Channel Not Found."); return; }
  document.title = ch.name;
  topBar(95);

  // Ensure lights finish before player starts
  var startNow = function(){ startPlayer(ch); };
  if(_lightsDone) startNow();
  else {
    var wait = setInterval(function(){
      if(_lightsDone){ clearInterval(wait); startNow(); }
    }, 80);
  }
}

document.addEventListener("DOMContentLoaded", main);
})();
</script>

function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}

var TIER = getTier();
var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];

function toast(msg, type, dur){

  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }

function rawCookie(c){
  return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
}
function withCookie(u, r){
  if(!u || !r) return u;
  if(u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}

function isNonEmpty(v){
  return typeof v === "string" && v.trim().length > 0;
}

function normalizeKidKey(kid, key){
  if(!isNonEmpty(kid) || !isNonEmpty(key)) return null;
  return {
    kid: kid.trim().toLowerCase(),
    key: key.trim().toLowerCase()
  };
}

/* ═══════════ BUILD CLEAR KEYS ═══════════
   Supports both "sportlink" (new) and "sonuxs" (old) arrays.
*/
function buildClearKeys(ch){
  var out = {};

  // Try "sportlink" array first (new API)
  if(Array.isArray(ch.sportlink) && ch.sportlink.length > 0){
    ch.sportlink.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }

  // Try "sonuxs" array (old API)
  if(Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0){
    ch.sonuxs.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }

  // Fallback to single key pair
  var single = normalizeKidKey(ch.key_id, ch.key);
  if(single) out[single.kid] = single.key;

  return out;
}

function keyModeOf(ch){
  var hasSportlink = Array.isArray(ch.sportlink) && ch.sportlink.length > 0;
  var hasSonuxs    = Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0;
  var hasMulti     = hasSportlink || hasSonuxs;
  var hasSingle    = isNonEmpty(ch.key_id) && isNonEmpty(ch.key);
  if(hasMulti && hasSingle) return "mixed";
  if(hasMulti)              return "multi";
  if(hasSingle)             return "single";
  return "none";
}

/* ═══════════ LOAD DATA (primary API only) ═══════════ */
async function loadData(){
  try {
    var r = await fetch(API, {cache:"no-store", headers:{Accept:"application/json"}});
    if(r.ok) {
      var d = await r.json();
      // New API returns plain array
      if(Array.isArray(d) && d.length > 0){
        return { channels: d };
      }
      // Old API returns { channels: [...] }
      if(d && Array.isArray(d.channels) && d.channels.length > 0){
        return d;
      }
    }
  } catch(e) {
    console.warn("API failed:", e);
  }

  return { channels: [] };
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {
    "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1,
    "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2
  };
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx  = 0;
  var fitBtn  = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();

  return true;
}

async function startPlayer(ch){
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

  var player = new shaka.Player();
  await player.attach($vid);

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements:[
      "play_pause","mute","volume",
      "time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{
      base:    "#828282",
      buffered:"#ffc336",
      played:  "#1fc7ff"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var cookie = ch.cookie;
  var raw    = rawCookie(cookie);
  var url    = ch.stream_url;
  var drmKeys = buildClearKeys(ch);
  var keyMode = keyModeOf(ch);

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(Object.keys(drmKeys).length === 0){
    toast("No DRM Keys Available","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries    = 0;
  var edgeTried  = false;
  var lastTry    = 0;
  var started    = false;
  var stallTmr   = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d     = await loadData();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie  = fresh.cookie;
      raw     = rawCookie(cookie);
      drmKeys = freshKeys;
      keyMode = keyModeOf(fresh);
      url     = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast(shakaErrStr(err),"err",6000);
    }
  });

  try{
    setMsg("Loading Stream…");
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }

  function onPlaying(){
    started = true;
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error",   function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

async function main(){
  var id = getChId(), data;
  try{
    setMsg("Fetching Channels…");
    data = await loadData();
  }catch(_){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }
  if(!id){ renderList(data.channels); return; }
  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){ errMsg("Channel Not Found."); return; }
  document.title = ch.name;
  await startPlayer(ch);
}

document.addEventListener("DOMContentLoaded", main);
})();
</script>
